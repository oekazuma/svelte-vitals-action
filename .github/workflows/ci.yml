name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Also runs `pnpm install --frozen-lockfile`, so there is no separate install step.
      # `node@24` floats on purpose: the action itself runs on whatever node24 the consumer's
      # runner ships, and Renovate does not track this input.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.1
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # A committed dist/ that no longer matches source would silently ship stale
      # behavior to every consumer pinned to this ref — fail the build instead.
      - name: Verify dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is stale — run 'pnpm build' and commit the result."
            git status --porcelain -- dist
            exit 1
          fi
