name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Also runs `pnpm install --frozen-lockfile`, so there is no separate install step.
      # Stays on Node 24 because action.yml's `using: node24` is what consumers run; Renovate
      # bumps the patch/minor but is held below 25 (see renovate.json).
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.3
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # A committed dist/ that no longer matches source would silently ship stale
      # behavior to every consumer pinned to this ref — fail the build instead.
      - name: Verify dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is stale — run 'pnpm build' and commit the result."
            git status --porcelain -- dist
            exit 1
          fi
      - name: Install the end-to-end fixture
        run: npm ci --ignore-scripts
        working-directory: test/e2e/workspace
      - run: pnpm test:e2e
